groups:
  - name: inkwell-gateway
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(inkwell_gateway_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(inkwell_gateway_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on API gateway"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(inkwell_gateway_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 1s"
          description: "P99 latency is {{ $value | humanizeDuration }}."

      - alert: GatewayDown
        expr: up{job="inkwell-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API gateway is down"
          description: "Prometheus cannot scrape the api-gateway /metrics endpoint."

      - alert: HighInFlightRequests
        expr: inkwell_gateway_requests_in_flight > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of in-flight requests"
          description: "{{ $value }} requests currently in flight."
