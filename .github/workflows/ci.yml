name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/inkwell

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      blog-service: ${{ steps.filter.outputs.blog-service }}
      feed-service: ${{ steps.filter.outputs.feed-service }}
      notify-service: ${{ steps.filter.outputs.notify-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            auth-service:
              - 'auth-service/**'
            blog-service:
              - 'blog-service/**'
            feed-service:
              - 'feed-service/**'
            notify-service:
              - 'notify-service/**'
            frontend:
              - 'frontend/**'

  build-push:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: ./api-gateway
            changed: ${{ needs.changes.outputs.api-gateway }}
          - service: auth-service
            context: ./auth-service
            changed: ${{ needs.changes.outputs.auth-service }}
          - service: blog-service
            context: ./blog-service
            changed: ${{ needs.changes.outputs.blog-service }}
          - service: feed-service
            context: ./feed-service
            changed: ${{ needs.changes.outputs.feed-service }}
          - service: notify-service
            context: ./notify-service
            changed: ${{ needs.changes.outputs.notify-service }}
          - service: frontend
            context: ./frontend
            changed: ${{ needs.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  update-manifests:
    runs-on: ubuntu-latest
    needs: [changes, build-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update image tags in manifests
        run: |
          declare -A changed
          changed[api-gateway]="${{ needs.changes.outputs.api-gateway }}"
          changed[auth-service]="${{ needs.changes.outputs.auth-service }}"
          changed[blog-service]="${{ needs.changes.outputs.blog-service }}"
          changed[feed-service]="${{ needs.changes.outputs.feed-service }}"
          changed[notify-service]="${{ needs.changes.outputs.notify-service }}"
          changed[frontend]="${{ needs.changes.outputs.frontend }}"

          for service in "${!changed[@]}"; do
            if [ "${changed[$service]}" = "true" ]; then
              NEW_TAG="${{ env.IMAGE_PREFIX }}/${service}:main-${{ steps.sha.outputs.short }}"
              sed -i "s|image: ${{ env.IMAGE_PREFIX }}/${service}:.*|image: ${NEW_TAG}|g" \
                infra/k8s/services/${service}/deployment.yaml 2>/dev/null || true
              echo "Updated ${service} to ${NEW_TAG}"
            fi
          done

      - name: Commit and push updated manifests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(infra): update image tags to ${{ steps.sha.outputs.short }} [skip ci]"
          file_pattern: "infra/k8s/**/*.yaml"